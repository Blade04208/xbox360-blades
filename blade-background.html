<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animated blade background</title>
    <style>
        @property --blade-phase {
            syntax: "<percentage>";
            inherits: false;
            initial-value: 0%;
        }

        .blade-background {
            --blade-light: #9af14b;
            --blade-mid: #5bb940;
            --blade-dark: #28653b;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background: radial-gradient(ellipse at 47% 46%, var(--blade-mid) 24%, var(--blade-dark) 115%);
        }

        .blade-background::before,
        .blade-background::after,
        .blade-background > .blade-background-glow {
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .blade-background::before,
        .blade-background::after {
            content: "";
            background: repeating-radial-gradient(ellipse var(--blade-radius) at var(--blade-center),
                transparent var(--blade-phase),
                var(--blade-band) calc(15% + var(--blade-phase)),
                transparent calc(31% + var(--blade-phase)));
            mask-image:
                conic-gradient(from var(--blade-angle) at var(--blade-center),
                    transparent, #000 22% 48%, transparent 87%),
                radial-gradient(ellipse var(--blade-radius) at var(--blade-center),
                    transparent 3%, #000 22%);
            mask-composite: intersect;
        }

        .blade-background::before {
            --blade-center: 39% 58%;
            --blade-radius: 78% 105%;
            --blade-angle: 195deg;
            --blade-band: var(--blade-light);
            opacity: 0.65;
        }

        .blade-background::after {
            --blade-center: 55% 32%;
            --blade-radius: 88% 108%;
            --blade-angle: 14deg;
            --blade-band: var(--blade-dark);
            --blade-phase: -7%;
            opacity: 0.66;
        }

        .blade-background > .blade-background-glow {
            z-index: -2;
            background: radial-gradient(ellipse 36% 47% at 57% 57%, var(--blade-light), transparent);
            opacity: 0.62;
        }

        @media (prefers-reduced-motion: no-preference) {
            .blade-background::before {
                animation: blade-ripple-out 7.5s linear infinite;
            }

            .blade-background::after {
                animation: blade-ripple-in 6.5s linear infinite;
            }

            .blade-background > .blade-background-glow {
                animation: blade-glow 16.5s ease-in-out infinite;
            }
        }

        /* A shift by one gradient period keeps each wrap seamless. */
        @keyframes blade-ripple-out {
            to { --blade-phase: 31%; }
        }

        @keyframes blade-ripple-in {
            to { --blade-phase: -38%; }
        }

        /* Use the ratios from the 320 / 625 / 990 layout keyframes. */
        @keyframes blade-glow {
            32.3% { transform: translate(24%, 21%) scale(1.28); }
            63.1% { transform: translate(-9%, -4%) scale(1.06, 1); }
        }
    </style>
</head>
<body>
    <div class="blade-background" style="aspect-ratio: 16 / 9" aria-hidden="true">
        <span class="blade-background-glow"></span>
    </div>
</body>
</html>
